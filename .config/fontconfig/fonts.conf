<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- English fonts -->

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>sans-serif</string>
    </test>
    <test qual="any" name="lang" compare="contains">
      <string>en</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>serif</string>
    </test>
    <test qual="any" name="lang" compare="contains">
      <string>en</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif</string>
    </edit>
  </match>

  <!-- Fira Code -->

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Fira Code</string>
    </edit>
  </match>

  <!-- Source Han Sans -->

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>sans-serif</string>
    </test>
    <test qual="any" name="lang" compare="contains">
      <string>zh-cn</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Source Han Sans SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>sans-serif</string>
    </test>
    <test qual="any" name="lang" compare="contains">
      <string>zh-tw</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Source Han Sans TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>sans-serif</string>
    </test>
    <test qual="any" name="lang" compare="contains">
      <string>zh-hk</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Source Han Sans HC</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>sans-serif</string>
    </test>
    <test qual="any" name="lang" compare="contains">
      <string>ja</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Source Han Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>sans-serif</string>
    </test>
    <test qual="any" name="lang" compare="contains">
      <string>ko</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Source Han Sans K</string>
    </edit>
  </match>

  <!-- Source Han Sans for monospace -->

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>monospace</string>
    </test>
    <test qual="any" name="lang" compare="contains">
      <string>zh-cn</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Source Han Sans SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>monospace</string>
    </test>
    <test qual="any" name="lang" compare="contains">
      <string>zh-tw</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Source Han Sans TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>monospace</string>
    </test>
    <test qual="any" name="lang" compare="contains">
      <string>zh-hk</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Source Han Sans HC</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>monospace</string>
    </test>
    <test qual="any" name="lang" compare="contains">
      <string>ja</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Source Han Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>monospace</string>
    </test>
    <test qual="any" name="lang" compare="contains">
      <string>ko</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Source Han Sans K</string>
    </edit>
  </match>

  <!-- Source Han Serif -->

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>serif</string>
    </test>
    <test qual="any" name="lang" compare="contains">
      <string>zh-cn</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Source Han Serif SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>serif</string>
    </test>
    <test qual="any" name="lang" compare="contains">
      <string>zh-tw</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Source Han Serif TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>serif</string>
    </test>
    <test qual="any" name="lang" compare="contains">
      <string>zh-hk</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Source Han Serif HC</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>serif</string>
    </test>
    <test qual="any" name="lang" compare="contains">
      <string>ja</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Source Han Serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>serif</string>
    </test>
    <test qual="any" name="lang" compare="contains">
      <string>ko</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Source Han Serif K</string>
    </edit>
  </match>

</fontconfig>
