general {
  hide_cursor = true
  ignore_empty_input = true
}

animation {
  bezier = easeOutCubic, 0.33, 1, 0.68, 1
  animation = fade, 1, 5, easeOutCubic
  animation = inputField, 1, 1, easeOutCubic
}

background {
  monitor =
  path = .config/niri/lockscreen
}

label {
  monitor =

  text = $TIME
  font_size = 96
  font_family = TeX Gyre Adventor

  halign = center
  valign = center
  position = 0, 370
}

label {
  monitor =

  text = cmd[update:1000] date +%Y-%m-%d
  font_size = 16
  font_family = TeX Gyre Adventor

  halign = center
  valign = center
  position = 0, 270
}

input-field {
  monitor =

  size = 20%, 5%
  outline_thickness = 0

  dots_size = 0.2
  font_family = Source Han Sans SC
  placeholder_text =
  fail_text = <b>密码错误，剩余 $ATTEMPTS 次机会</b>

  outer_color = rgba(00000000)
  inner_color = rgba(00000022)
  check_color = rgba(b0c4de44)
  fail_color = rgba(ff643777)
  font_color = rgb(dddddd)

  fade_on_empty = true
  rounding = 12

  position = 0, -25%
  halign = center
  valign = center
}
